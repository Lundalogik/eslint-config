name: Pull Request Checks
on: [pull_request, merge_group]

concurrency:
  # Only allow one active run of this workflow, per PR.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/set-up-node
    - run: npm ci
    # A step of this job rather than a job of its own: it reuses the install
    # above, and it gates automerge through `needs: [lint]` without adding a job
    # name that the branch ruleset's required checks would have to be updated
    # for. It runs before the lint because it is the more specific failure -- on
    # a Dependabot bump that both drifts the range and breaks the lint, its
    # message is the one that explains the other.
    - name: Check the typescript peer range still matches typescript-eslint
      run: npm run check:peer-range
    - run: npm run lint

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/set-up-node
      - run: npm ci
      - run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  autosquash:
    name: Block Autosquash Commits
    runs-on: ubuntu-latest
    steps:
      - name: Block Autosquash Commits
        if:  github.event_name != 'merge_group'
        uses: xt0rted/block-autosquash-commits-action@79880c36b4811fe549cfffe20233df88876024e7 # v2.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  automerge:
    needs: [lint, autosquash]
    if: github.event.pull_request.head.repo.owner.login == 'Lundalogik' && github.actor == 'dependabot[bot]' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Automerge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_PR }}
        run: "curl --fail-with-body -L -X PUT -H \"Accept: application/vnd.github+json\" -H \"Authorization: Bearer $GH_TOKEN\" -H \"X-GitHub-Api-Version: 2022-11-28\" https://api.github.com/repos/Lundalogik/eslint-config/pulls/$PR_NUMBER/merge -d '{\"merge_method\":\"rebase\"}'"
